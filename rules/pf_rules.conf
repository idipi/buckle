# macOS Packet Filter (pf) Configuration Template for Agent Network Containment
# Location: /etc/pf.anchors/agent_sandbox (or loaded via pfctl -f)
#
# Threat Model: Kernel-level egress restriction for untrusted subshells/agents.
# Usage:
#   sudo pfctl -ef rules/pf_rules.conf
#   sudo pfctl -d (to disable)

# 1. Macro definitions
ext_if = "en0"
agent_user = "ai-worker"  # If running under dedicated macOS user account

# 2. Default policy: Allow loopback unconditionally
set skip on lo0

# 3. Restrict agent user to local proxy port (18080) and DNS
# block out quick on $ext_if proto tcp from any user $agent_user to any port != { 18080, 53 }
# pass out quick proto tcp to any port { 80, 443 } keep state
